const KEY='cxx_pandian_v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));prog()}
function g(id){return S[id]||(S[id]={s:null,o:null})}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){let h='',lc='',lr='';
for(const [id,cat,reg,ko,zh,u,st] of D){
 if(cat!==lc){h+=`<div class="cat">${cat}</div>`;lc=cat;lr=''}
 if(cat+reg!==lr){h+=`<div class="reg">区域 ${reg}</div>`;lr=cat+reg}
 h+=`<div class="card" id="c${id}"><div class="t"><span class="no">${id}.</span><span class="ko">${esc(ko)}</span>${zh?`<span class="zh">${esc(zh)}</span>`:''}${u?`<span class="u">${esc(u)}</span>`:''}</div>

 <div class="row od"><div class="lab">订货<span id="ov${id}"></span></div><div class="btns" id="ob${id}"></div></div></div>`}

function btns(id,k){const v=g(id)[k];const zl=k==='o'?'不订':'没有';let h=`<button class="z${v===0?' on':''}" onclick="setv(${id},'${k}',0)">${zl}</button>`;
for(let n=1;n<=10;n++)h+=`<button class="${v===n?'on':''}" onclick="setv(${id},'${k}',${n})">${n}</button>`;
h+=`<button class="pm" onclick="step(${id},'${k}',-1)">−</button><button class="pm" onclick="step(${id},'${k}',1)">＋</button><button class="pm" onclick="step(${id},'${k}',0.5)">+½</button>`;
if(v!==null)h+=`<button onclick="setv(${id},'${k}',null)">清空</button>`;return h}
function upd(id){const x=g(id),u=(D[id-1][5]||'');
document.getElementById('sb'+id).innerHTML=btns(id,'s');document.getElementById('ob'+id).innerHTML=btns(id,'o');
document.getElementById('sv'+id).textContent=x.s===null?'':x.s+' '+u;
document.getElementById('ov'+id).textContent=x.o===null?'':(x.o===0?'不订':x.o+' '+u);
document.getElementById('c'+id).classList.toggle('done',x.o!==null||x.s!==null)}

function step(id,k,d){let v=g(id)[k]||0;v=Math.max(0,Math.round((v+(d===0.5?0.5:d))*10)/10);setv(id,k,v)}

function csvCell(x){x=x==null?'':String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
function buildCSV(all){const r=[['序号','类别','区域','韩文','中文','单位','库存','订货量']];
for(const [id,cat,reg,ko,zh,u] of D){const x=S[id]||{s:null,o:null};if(!all&&!(x.o>0)&&x.s===null)continue;r.push([id,cat,'区域'+reg,ko,zh,u,x.s??'',x.o??''])}
return r.map(a=>a.map(csvCell).join(',')).join('\n')}
function gen(){const ord=D.filter(d=>(S[d[0]]||{}).o>0),so=D.filter(d=>{const x=S[d[0]];return x&&x.s!==null&&!(x.o>0)});

<p class="tip">CSV 可以在 Google 表格里「导入」，或发给秘书长帮你生成表格。</p><textarea id="csv" readonly>${esc(buildCSV(false))}</textarea>`;
const o=document.getElementById('out');o.innerHTML=h;o.style.display='block';o.scrollTop=0}
function txt(){let t=today()+' 川川香订货\n';for(const [id,c,r,ko,zh,u] of D){const x=S[id];if(x&&x.o>0)t+=`${id}. ${ko}/${zh} 库存${x.s??'-'} 订货${x.o}${u}\n`}return t}
function cp(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('已复制'),()=>fb(t));else fb(t)}
function fb(t){const a=document.getElementById('csv');a.value=t;a.select();document.execCommand('copy');alert('已复制')}
function copyText(){cp(txt())}function copyCSV(){cp(buildCSV(false))}
function dl(all){const b=new Blob(['\ufeff'+buildCSV(all)],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=today()+'_盘货订货单.csv';document.body.appendChild(a);a.click();a.remove()}
function closeOut(){document.getElementById('out').style.display='none'}
