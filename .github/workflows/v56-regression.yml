name: v56 full regression
on:
  push:
    branches: [work/v56-four-products, work/v57-two-products, work/v58-storage-quota, work/storage-cleanup-v59]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test --test-timeout=120000 tests/*.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: CCX_PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/node_modules/playwright" python3 scripts/run-browser-regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: test-output/browser-regression
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules
      - run: npm run test:shared
      - run: npm run test:shared-view
      - run: npm run test:shared-transitions
      - run: npm run test:supplier-rehearsal
      - run: npx firebase emulators:exec --only firestore --project demo-ccx-catalog-versions "node tests/catalog-versions.test.mjs"
