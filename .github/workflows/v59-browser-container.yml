name: v59 browser container recheck
on:
  push:
    branches: [work/v59-browser-container]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: CCX_PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/node_modules/playwright" python3 scripts/run-browser-regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: test-output/browser-regression
