name: v77 targeted fixes and full regression
on:
  push:
    branches: [work/v77-five-targeted-fixes]
concurrency:
  group: v77-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v77-five-targeted-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: |
          npm run build:preview
          npm run build
          git diff --check
          git add redesign-preview/preview.bundle.js cloud-app.bundle.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(v77): rebuild production and legacy bundles'
            git push origin HEAD:work/v77-five-targeted-fixes
          fi
  node:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v77-five-targeted-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: |
          mkdir -p test-output
          result=0
          npm audit --audit-level=low > test-output/audit.log 2>&1 || result=$?
          cat test-output/audit.log
          exit "$result"
      - run: |
          mkdir -p test-output
          result=0
          node --test --test-timeout=120000 tests/*.test.cjs > test-output/node.log 2>&1 || result=$?
          tail -35 test-output/node.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-log
          path: test-output/*.log
  browser:
    needs: build
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v77-five-targeted-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: CCX_PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/node_modules/playwright" python3 scripts/run-browser-regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: test-output/browser-regression
  cloud:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v77-five-targeted-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: |
          mkdir -p test-output/cloud
          set -o pipefail
          npm run test:rules 2>&1 | tee test-output/cloud/rules.log
      - run: |
          mkdir -p test-output/cloud
          set -o pipefail
          npm run test:shared 2>&1 | tee test-output/cloud/shared.log
      - run: |
          mkdir -p test-output/cloud
          set -o pipefail
          npm run test:shared-view 2>&1 | tee test-output/cloud/shared-view.log
      - run: |
          mkdir -p test-output/cloud
          set -o pipefail
          npm run test:shared-transitions 2>&1 | tee test-output/cloud/shared-transitions.log
      - run: |
          mkdir -p test-output/cloud
          set -o pipefail
          npm run test:supplier-rehearsal 2>&1 | tee test-output/cloud/supplier-rehearsal.log
      - run: |
          mkdir -p test-output/cloud
          set -o pipefail
          npx firebase emulators:exec --only firestore --project demo-ccx-catalog-versions "node tests/catalog-versions.test.mjs" 2>&1 | tee test-output/cloud/catalog-versions.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-logs
          path: |
            test-output/cloud
            firestore-debug.log

  verified-report:
    needs: [build, node, browser, cloud]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v77-five-targeted-fixes
      - uses: actions/download-artifact@v4
        with:
          path: verified-artifacts
      - name: Verify the same-run reports and preserve results
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,subprocess
          a=pathlib.Path('verified-artifacts')
          node=next(a.rglob('node.log'))
          txt=node.read_text()
          def last(label):
            vals=re.findall(r'(?:ℹ|#)\s*'+label+r'\s+(\d+)',txt)
            assert vals, label
            return int(vals[-1])
          n={'passed':last('pass'),'failed':last('fail'),'skipped':last('skipped')}
          assert n['passed']>16000 and n['failed']==0 and n['skipped']==0
          summary=json.loads(next(a.rglob('summary.json')).read_text())
          assert summary.get('allPassed') and len(summary.get('runs',[]))>=34
          browser={'runs':len(summary['runs']),'passed':sum(int(r.get('passed',0)) for r in summary['runs']),'failed':sum(int(r.get('failed',0)) for r in summary['runs']),'allPassed':True}
          logs=list((a/'cloud-logs').rglob('*.log'))
          assert len(logs)>=6, len(logs)
          report={'runId':os.environ['GITHUB_RUN_ID'],'testedCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'node':n,'browser':browser,'cloudLogFiles':len(logs),'result':'success','note':'All jobs passed on isolated fixtures; no production orders touched'}
          out=pathlib.Path('docs/v77');out.mkdir(parents=True,exist_ok=True)
          (out/'ci-result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Commit verified report only after all regression jobs pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v77/ci-result.json
          git commit -m 'test(v77): save successful complete regression results'
          git push origin HEAD:work/v77-five-targeted-fixes
