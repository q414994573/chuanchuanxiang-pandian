<style>
/* A bounded five-second sequence; independent of login and cloud loading. */
#ccx-welcome{position:fixed;inset:0;z-index:10000;pointer-events:auto;touch-action:manipulation;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#be0925 0%,#a8001c 65%,#990019 100%);color:white;font-family:system-ui,sans-serif;animation:ccx-welcome-exit 2s ease-in-out 3s forwards}
#ccx-welcome .welcome-brand{mix-blend-mode:screen;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);box-sizing:border-box;transform:translateY(-2vh);pointer-events:none}
#ccx-welcome .welcome-emblem{mix-blend-mode:screen;position:relative;width:clamp(175px,54vw,230px);aspect-ratio:1;opacity:0;animation:ccx-emblem-in 2s ease-in-out both}
#ccx-welcome .welcome-art{position:relative;width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;opacity:0;transition:opacity .3s ease-out}
#ccx-welcome.art-ready .welcome-art{opacity:1}
#ccx-welcome .welcome-glow{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,#ff7b5938 0%,#ff6c3610 42%,transparent 70%);opacity:0;animation:ccx-glow 1s ease-in-out 2s both}
#ccx-welcome .welcome-title{margin:20px 0 0;font-size:clamp(46px,13vw,66px);line-height:1.25;letter-spacing:.12em;padding-left:.12em;font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:750;opacity:0;animation:ccx-title-in 1.8s ease-in-out .2s both}
#ccx-welcome .welcome-skip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:0;width:100%;text-align:center;color:#fff9;font:13px system-ui,sans-serif;pointer-events:none}
@keyframes ccx-emblem-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes ccx-title-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes ccx-glow{0%,100%{opacity:0;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes ccx-welcome-exit{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#ccx-welcome{display:none}#ccx-welcome *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="ccx-welcome" role="button" tabindex="0" aria-label="跳过开场，进入订货网页">
 <div class="welcome-brand" aria-hidden="true">
  <div class="welcome-emblem"><span class="welcome-glow"></span><img class="welcome-art" src="./assets/emblem-v65.png" alt="" decoding="async" fetchpriority="low"></div>
  <div class="welcome-title">川川香</div>
 </div>
 <span class="welcome-skip" aria-hidden="true">轻点跳过</span>
</div>
<div class="banner">川川香 · 订货总控台<small>共同盘货、实时同步、双方定稿</small></div>
